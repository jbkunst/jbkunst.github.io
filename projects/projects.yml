# Curated order; the landing's featured projects are maintained separately.
- title: CensoLab
  path: https://censolab.cl/
  description: Explore Chilean census data through interactive visualizations and territorial comparisons.
  categories: [Data product, Visualization, Chile, Spanish]

- title: highcharter
  path: https://jkunst.com/highcharter/
  description: An R interface to Highcharts for interactive charts, maps, stock charts and custom visualizations.
  categories: [R package, Visualization]

- title: bcchr
  path: https://github.com/jbkunst/bcchr
  description: Access statistical series from the Central Bank of Chile in R.
  categories: [R package, Chile, Economics]

- title: risk3r
  path: https://github.com/jbkunst/risk3r
  description: Credit-risk modelling helpers that complement workflows built with the scorecard R package.
  categories: [R package, Credit risk]

- title: celavi
  path: https://github.com/jbkunst/celavi
  description: Tools for permutation importance and feature selection in R.
  categories: [R package, Machine learning]

- title: klassets
  path: https://github.com/jbkunst/klassets
  description: Simulated data sets for teaching statistics and machine learning in R.
  categories: [R package, Education, Machine learning]

- title: rchess
  path: https://github.com/jbkunst/rchess
  description: Chess logic and visualization in R.
  categories: [R package, Visualization, Chess]

- title: Visual Data Lab
  path: https://jkunst.com/visual-data-lab/
  description: Interactive experiments that explore data, statistics and machine learning through visualization.
  categories: [Visualization, Interactive]

- title: Visual Data Sketches
  path: https://jkunst.com/visual-data-sketches/
  description: Visual explanations of data methods and algorithms, explored step by step.
  categories: [Visualization, Interactive]
