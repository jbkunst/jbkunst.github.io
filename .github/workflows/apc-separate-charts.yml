name: Separate APC charts

on:
  push:
    paths:
      - ".github/workflows/apc-separate-charts.yml"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Separate APC charts and commentary
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path("blog/posts/2026-09-12-decomposing-credit-vintages/index.qmd")
          text = path.read_text()
          start_marker = "The same result can now be read as a decomposition of portfolio risk."
          end_marker = "## One important caveat"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = base64.b64decode("").decode()
          path.write_text(text[:start] + replacement + "\n" + text[end:])

          Path(".github/workflows/apc-separate-charts.yml").unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/2026-09-12-decomposing-credit-vintages/index.qmd .github/workflows/apc-separate-charts.yml
          git commit -m "feat(post): separate APC charts [skip ci]"
          git push origin master
