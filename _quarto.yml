project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - blog/index.qmd
    - blog/posts/**/*.qmd
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Joshua Kunst"
  site-url: https://jbkunst.github.io
  navbar: false

execute:
  freeze: auto

format:
  html:
    theme: none
    css:
      - assets/css/landing.css
      - assets/css/site.css
    include-before-body: assets/includes/site-nav.html
    include-after-body: assets/js/landing.js
    minimal: true
