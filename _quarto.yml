project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - blog/index.qmd
    - blog/posts/**/*.qmd
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Joshua Kunst"
  site-url: https://jkunst.com
  favicon: assets/images/jkunst-logo-dark.svg\n  draft-mode: unlinked
  search: false
  navbar:
    title: false\n    logo: assets/images/jkunst-logo-light.svg\n    logo-alt: "Joshua Kunst"
    pinned: true
    right:
      - text: Blog
        href: blog/index.qmd
      - text: Visual Data Lab ↗
        href: https://jkunst.com/visual-data-lab/
      - text: GitHub ↗
        href: https://github.com/jbkunst
  page-footer:
    center: "Joshua Kunst · 2026 · Built with [Quarto](https://quarto.org/)"

execute:
  freeze: auto

format:
  html:
    theme: none
    css: assets/css/navbar.css
    minimal: true
