project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
    - blog/index.qmd
    - projects/index.qmd
    - blog/posts/**/*.qmd
  resources:
    - CNAME
    - .nojekyll
    - robots.txt

website:
  title: "Joshua Kunst"
  site-url: "https://jkunst.com"
  google-analytics: "G-ECZ9XLT78C"
  draft-mode: gone
  search: false
  navbar:
    title: "jk"
    pinned: true
    collapse: false
    right:
      - text: Projects
        href: projects/index.qmd
      - text: Blog
        href: blog/index.qmd
  page-footer:
    center: "Joshua Kunst · 2026 · Built with [Quarto](https://quarto.org/)"

execute:
  freeze: auto

format:
  html:
    theme: materia
    css: [assets/css/navbar.css]
    minimal: false
    title-block-banner: true
    grid:
      body-width: 700px
      sidebar-width: 240px
      margin-width: 240px
      gutter-width: 1.5rem
